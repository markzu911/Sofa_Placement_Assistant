<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>别墅大型沙发生图</title>
    <script>
      (() => {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const index = parts.indexOf("ai-tool");
        const base =
          index !== -1 && parts[index + 1] ? `/${parts.slice(0, index + 2).join("/")}/` : "/";
        window.__SOFA_ASSET_BASE__ = base;
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = `${base}styles.css`;
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <main class="app-root">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p>Villa Sofa Studio</p>
            <h1>别墅大型沙发生图</h1>
          </div>
        </div>
        <div class="topbar-meta">
          <span class="status-pill" id="apiStatus">连接中</span>
          <span id="modelName">生成服务检测中</span>
        </div>
      </header>

      <form class="studio" id="generateForm">
        <section class="input-panel" aria-label="参考图上传">
          <div class="panel-heading">
            <p class="eyebrow">References</p>
            <h2>上传参考图</h2>
          </div>

          <label class="upload-card product-card" id="productDrop">
            <input id="productImage" type="file" accept="image/png,image/jpeg,image/webp" />
            <img id="productPreview" alt="" />
            <span class="upload-plus" aria-hidden="true"></span>
            <span class="upload-copy">
              <strong>大型沙发产品图</strong>
              <small id="productMeta">必传，锁定组合方式、转角、贵妃位、模块和面料</small>
            </span>
          </label>

          <label class="upload-card room-card" id="roomDrop">
            <input id="roomImage" type="file" accept="image/png,image/jpeg,image/webp" />
            <img id="roomPreview" alt="" />
            <span class="upload-plus" aria-hidden="true"></span>
            <span class="upload-copy">
              <strong>别墅客厅房间图</strong>
              <small id="roomMeta">必传，锁定层高、墙面、窗位、采光和豪宅氛围</small>
            </span>
          </label>

          <div class="settings-card">
            <label class="field">
              <span>画幅</span>
              <select id="aspectRatio">
                <option value="16:9" selected>16:9 豪宅横幅</option>
                <option value="4:3">4:3 空间展示</option>
                <option value="3:2">3:2 摄影画幅</option>
                <option value="1:1">1:1 方图</option>
              </select>
            </label>
            <label class="field">
              <span>质感</span>
              <select id="imageSize">
                <option value="4K">4K 高清</option>
                <option value="8K" selected>8K 质感</option>
              </select>
            </label>
          </div>

          <label class="field brief-field">
            <span>补充要求</span>
            <textarea id="extraInstruction" rows="4" placeholder="可选：例如保留原房间吊灯、地毯更高级、茶几使用大理石..."></textarea>
          </label>

          <button class="primary-action" id="generateButton" type="submit" disabled>
            <span class="action-icon" aria-hidden="true"></span>
            <span>生成豪宅沙发空间图</span>
          </button>
          <p class="message" id="messageText">请先上传大型沙发产品图和别墅客厅房间图</p>
        </section>

        <section class="preview-panel" aria-label="生成结果">
          <header class="preview-header">
            <div>
              <p class="eyebrow">Preview</p>
              <h2 id="previewTitle">等待生成</h2>
            </div>
            <button class="secondary-action" id="downloadButton" type="button" disabled>下载</button>
          </header>

          <div class="preview-stage" id="previewStage">
            <div class="preview-frame" id="previewFrame">
              <div class="empty-state" id="emptyState">
                <span class="empty-icon" aria-hidden="true"></span>
                <strong>豪宅客厅效果图</strong>
                <small>广角斜侧视角 · 完整展示大型沙发组合</small>
              </div>
              <img id="resultImage" alt="生成结果" title="点击预览大图" />
              <div class="loading-mask" id="loadingMask">
                <div class="loader" aria-hidden="true"></div>
                <p>正在生成别墅软装摄影图</p>
              </div>
            </div>
          </div>
        </section>
      </form>

      <section class="history-panel" id="historyPanel" hidden>
        <header>
          <p class="eyebrow">History</p>
          <h2>生成记录</h2>
          <span id="historyCount">0 张</span>
        </header>
        <div class="history-list" id="historyList"></div>
      </section>

      <div class="image-modal" id="imageModal" aria-hidden="true" role="dialog" aria-label="图片预览">
        <div class="image-modal-backdrop" id="imageModalBackdrop"></div>
        <div class="image-modal-shell">
          <header class="image-modal-toolbar">
            <div>
              <p class="eyebrow">Preview</p>
              <h2>图片预览</h2>
            </div>
            <div class="image-modal-actions">
              <button class="secondary-action" id="modalDownloadButton" type="button">下载</button>
              <button class="icon-action" id="modalCloseButton" type="button" aria-label="关闭预览">×</button>
            </div>
          </header>
          <div class="image-modal-stage" id="imageModalStage">
            <img id="modalImage" alt="生成结果预览" />
          </div>
        </div>
      </div>
    </main>
    <script>
      (() => {
        const script = document.createElement("script");
        script.src = `${window.__SOFA_ASSET_BASE__ || "/"}app.js`;
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
